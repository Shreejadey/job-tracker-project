<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚀 Job Application Tracker</h1>
    <p class="tagline">Track your applications with premium AI-style design ✨</p>

    <form id="jobForm">
      <input type="text" id="company" placeholder="Company Name" required>
      <input type="text" id="role" placeholder="Job Role" required>
      <select id="status" required>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button type="submit">➕ Add Job</button>
    </form>

    <div class="stats">
      <h2>📊 Application Summary</h2>
      <p>Total Applications: <span id="total">0</span></p>
      <p>Success Rate: <span id="successRate">0%</span></p>
    </div>

    <div id="jobList" class="job-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
